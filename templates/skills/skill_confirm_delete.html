{% extends 'skills/base.html' %}

{% block title %}Delete Skill | Campus SkillSwap{% endblock %}

{% block content %}
<section class="container narrow-section">
    <div class="confirm-box">
        <p class="eyebrow">Delete listing</p>
        <h1>Remove “{{ skill.title }}”?</h1>
        <p>This will also remove its reviews. This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Yes, delete it</button>
            <a class="btn btn-outline-secondary" href="{% url 'skill_detail' skill.pk %}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
