{% extends 'skills/base.html' %}

{% block title %}Request {{ skill.title }} | Campus SkillSwap{% endblock %}

{% block content %}
<section class="container narrow-section">
    <p class="eyebrow">Booking request</p>
    <h1>Request {{ skill.title }}</h1>
    <form method="post" class="app-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Send request</button>
        <a class="btn btn-outline-secondary" href="{% url 'skill_detail' skill.pk %}">Cancel</a>
    </form>
</section>
{% endblock %}
