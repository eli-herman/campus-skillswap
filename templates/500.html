{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong | Campus SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
</head>
<body>
    {# Standalone on purpose: a server error page must not depend on the database or user session. #}
    <main class="container py-5 text-center error-page">
        <p class="error-code">500</p>
        <h1>Something went wrong on our end</h1>
        <p class="text-muted">The error has been logged. Please try again in a minute.</p>
        <a class="btn btn-primary mt-2" href="/">Back to Campus SkillSwap</a>
    </main>
</body>
</html>
